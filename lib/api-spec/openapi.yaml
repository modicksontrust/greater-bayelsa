openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Greater Bayelsa leadership development platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: geography
  - name: screening
  - name: voters
  - name: members
  - name: dues
  - name: meetings
  - name: attendance
  - name: hq-requests
  - name: events
  - name: posts
  - name: updates
  - name: notifications
  - name: feedback
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- Public geography / Register Now ----------
  /villages:
    get:
      operationId: listVillages
      tags: [geography]
      summary: List pilot villages with coordinator info (public)
      responses:
        "200":
          description: Villages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VillagePublic"
  /villages/{id}/units:
    get:
      operationId: listVillageUnits
      tags: [geography]
      summary: List units in a village
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"

  # ---------- AI screening (public) ----------
  /screening/chat:
    post:
      operationId: screeningChat
      tags: [screening]
      summary: AI eligibility screening chat turn (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningTurnInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningReply"

  # ---------- Voter roll (founder/assistant) ----------
  /voters:
    get:
      operationId: listVoters
      tags: [voters]
      summary: List voter roll with optional filters (HQ)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: villageId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Voters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voter"
  /voters/import:
    post:
      operationId: importVoters
      tags: [voters]
      summary: Bulk import voter roll rows (HQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoterImportBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoterImportResult"

  # ---------- Me ----------
  /me:
    get:
      operationId: getMe
      tags: [members]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: No member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [members]
      summary: Update own limited profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  # ---------- Members (role-scoped) ----------
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members within the caller's visibility scope
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: villageId
          in: query
          required: false
          schema: { type: integer }
        - name: unitId
          in: query
          required: false
          schema: { type: integer }
        - name: role
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: enrollMember
      tags: [members]
      summary: Enroll a new member (coordinators only; creates login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEnrollment"
      responses:
        "201":
          description: Enrolled member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "409":
          description: Duplicate VIN or account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /members/match:
    get:
      operationId: matchVoter
      tags: [members]
      summary: Match a voter-roll record by VIN or phone (coordinators)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: Matching voters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voter"
  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member within scope
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member (leaders update own scope; HQ manages roles)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/overview:
    get:
      operationId: getOverviewStats
      tags: [members]
      summary: Role-scoped overview stats (per village/unit rollups)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  # ---------- Dues ----------
  /dues/me:
    get:
      operationId: getMyDues
      tags: [dues]
      summary: Own dues history and current status
      responses:
        "200":
          description: Dues status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDues"
  /dues/status:
    get:
      operationId: getDuesStatus
      tags: [dues]
      summary: Per-member dues status for a period within scope
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string }
        - name: villageId
          in: query
          required: false
          schema: { type: integer }
        - name: unitId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Member dues statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberDuesStatus"
  /dues/rollup:
    get:
      operationId: getDuesRollup
      tags: [dues]
      summary: Aggregated paid/overdue rollup by village and unit within scope
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rollup rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuesRollupRow"
  /dues/bulk:
    post:
      operationId: recordBulkDues
      tags: [dues]
      summary: Record a bulk cash payment for unit members (unit leader)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDuesBody"
      responses:
        "201":
          description: Payments recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDuesResult"
  /dues/reminders:
    post:
      operationId: sendDuesReminders
      tags: [dues]
      summary: Send in-platform dues reminders to overdue members (HQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuesRemindersBody"
      responses:
        "200":
          description: Reminders sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuesRemindersResult"

  # ---------- Meetings ----------
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meeting records within scope
      parameters:
        - name: villageId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: submitMeeting
      tags: [meetings]
      summary: Submit a monthly meeting update (village head)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingSubmission"
      responses:
        "201":
          description: Meeting recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting with media and attendance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Attendance ----------
  /attendance/checkin:
    post:
      operationId: attendanceCheckin
      tags: [attendance]
      summary: QR self-check-in for a meeting (member scans code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinBody"
      responses:
        "201":
          description: Attendance logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "404":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/video:
    post:
      operationId: attendanceVideo
      tags: [attendance]
      summary: Record video-verified attendance for a member (leader)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoAttendanceBody"
      responses:
        "201":
          description: Attendance logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  # ---------- HQ requests ----------
  /hq-requests:
    get:
      operationId: listHqRequests
      tags: [hq-requests]
      summary: List requests to headquarters within scope
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqRequest"
  /hq-requests/{id}:
    patch:
      operationId: updateHqRequest
      tags: [hq-requests]
      summary: Respond to / resolve an HQ request (HQ)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HqRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Calendar ----------
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Calendar events visible to the caller (org-wide + local)
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event (HQ = org-wide; leaders = local)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}:
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event (creator or HQ)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Public posts ----------
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List public posts
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post (HQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post (HQ)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (HQ)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Community updates ----------
  /updates:
    get:
      operationId: listUpdates
      tags: [updates]
      summary: Community updates feed within scope, urgent first
      responses:
        "200":
          description: Updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityUpdate"
    post:
      operationId: createUpdate
      tags: [updates]
      summary: Post a community update (leaders and HQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityUpdateInput"
      responses:
        "201":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityUpdate"

  # ---------- Notifications / messaging ----------
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Own notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark own notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages:
    post:
      operationId: sendMessage
      tags: [notifications]
      summary: Send bulk or individual message to members (HQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSendInput"
      responses:
        "201":
          description: Message fan-out result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"

  # ---------- Feedback ----------
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List member feedback reports (HQ) or own reports (member)
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackReport"
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit a direct report to headquarters (member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Respond to / resolve a feedback report (HQ)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Storage ----------
  /trainings:
    get:
      tags: [training]
      operationId: listTrainings
      summary: List training sessions visible to the caller (with own registration state)
      responses:
        "200":
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      tags: [training]
      operationId: createTraining
      summary: Schedule a training session (HQ only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /trainings/{id}/register:
    post:
      tags: [training]
      operationId: registerTraining
      summary: Register interest/attendance for a training session (member)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRegistration"
        "409":
          description: Already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trainings/{id}/progress:
    post:
      tags: [training]
      operationId: updateTrainingProgress
      summary: Mark attendance/completion for registrants (HQ or session-village secretary)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingProgressBody"
      responses:
        "200":
          description: Updated registrations
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
  /trainings/{id}/registrants:
    get:
      tags: [training]
      operationId: listTrainingRegistrants
      summary: List registrants for a session (HQ or village executive)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registrants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingRegistration"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Unit:
      type: object
      required: [id, villageId, name]
      properties:
        id: { type: integer }
        villageId: { type: integer }
        name: { type: string }

    CoordinatorPublic:
      type: object
      required: [firstName, lastName]
      properties:
