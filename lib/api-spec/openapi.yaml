openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Greater Bayelsa voter management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: voters
    description: Voter records
  - name: stats
    description: Dashboard statistics
  - name: members
    description: Membership registration and profiles
  - name: posts
    description: News, jobs, scholarships and announcements
  - name: events
    description: Organization events calendar
  - name: notifications
    description: Member notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /voters:
    get:
      operationId: listVoters
      tags: [voters]
      summary: List voters with optional filters
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Search by name, VIN, or phone
        - name: lga
          in: query
          required: false
          schema: { type: string }
        - name: ward
          in: query
          required: false
          schema: { type: string }
        - name: supportLevel
          in: query
          required: false
          schema: { type: string }
        - name: contactStatus
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of voters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voter"
    post:
      operationId: createVoter
      tags: [voters]
      summary: Register a new voter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voter"
  /voters/{id}:
    get:
      operationId: getVoter
      tags: [voters]
      summary: Get a voter by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Voter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voter"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateVoter
      tags: [voters]
      summary: Update a voter
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoterUpdate"
      responses:
        "200":
          description: Updated voter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voter"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVoter
      tags: [voters]
      summary: Delete a voter
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Overall dashboard summary
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"
  /stats/by-lga:
    get:
      operationId: getStatsByLga
      tags: [stats]
      summary: Voter counts grouped by LGA
      responses:
        "200":
          description: Counts per LGA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LgaCount"
  /stats/by-support-level:
    get:
      operationId: getStatsBySupportLevel
      tags: [stats]
      summary: Voter counts grouped by support level
      responses:
        "200":
          description: Counts per support level
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportLevelCount"
  /stats/recent:
    get:
      operationId: getRecentVoters
      tags: [stats]
      summary: Most recently registered voters
      responses:
        "200":
          description: Recent voters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voter"
  /me:
    get:
      operationId: getMe
      tags: [members]
      summary: Get the signed-in user's member profile
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not registered as a member yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [members]
      summary: Update own member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /me/coordinator:
    get:
      operationId: getMyCoordinator
      tags: [members]
      summary: Get the coordinator for the member's unit/ward/LGA
      responses:
        "200":
          description: Coordinator (closest level found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: No coordinator assigned yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /members/match:
    get:
      operationId: matchVoter
      tags: [members]
      summary: Match a voter record by VIN or phone during registration
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 4 }
          description: VIN or phone number
      responses:
        "200":
          description: Matching voter records (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoterMatch"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members (admin)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Search by name, membership code, VIN, or phone
        - name: lga
          in: query
          required: false
          schema: { type: string }
        - name: ward
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: registerMember
      tags: [members]
      summary: Register the signed-in user as a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "409":
          description: Already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by id (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminUpdateMember
      tags: [members]
      summary: Update a member's role, status or category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List published posts
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}:
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the signed-in member's notifications (including broadcasts)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Send a notification to one member or broadcast to all (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "201":
          description: Sent notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a direct notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/members-summary:
    get:
      operationId: getMembersSummary
      tags: [stats]
      summary: Membership summary counts (admin)
      responses:
        "200":
          description: Membership counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Voter:
      type: object
      required:
        [
          id,
          firstName,
          lastName,
          gender,
          lga,
          ward,
          pollingUnit,
          supportLevel,
          contactStatus,
          createdAt,
        ]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string, enum: [male, female] }
        phone: { type: ["string", "null"] }
        vin: { type: ["string", "null"], description: Voter Identification Number }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        lga: { type: string, description: Local Government Area }
        ward: { type: string }
        pollingUnit: { type: string }
        supportLevel:
          type: string
          enum: [strong, leaning, undecided, opposed, unknown]
        contactStatus:
          type: string
          enum: [not_contacted, contacted, follow_up, unreachable]
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
    VoterInput:
      type: object
      required: [firstName, lastName, gender, lga, ward, pollingUnit]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender: { type: string, enum: [male, female] }
        phone: { type: ["string", "null"] }
        vin: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        lga: { type: string, minLength: 1 }
        ward: { type: string, minLength: 1 }
        pollingUnit: { type: string, minLength: 1 }
        supportLevel:
          type: string
          enum: [strong, leaning, undecided, opposed, unknown]
        contactStatus:
          type: string
          enum: [not_contacted, contacted, follow_up, unreachable]
        notes: { type: ["string", "null"] }
    VoterUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender: { type: string, enum: [male, female] }
        phone: { type: ["string", "null"] }
        vin: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        lga: { type: string, minLength: 1 }
        ward: { type: string, minLength: 1 }
        pollingUnit: { type: string, minLength: 1 }
        supportLevel:
          type: string
          enum: [strong, leaning, undecided, opposed, unknown]
        contactStatus:
          type: string
          enum: [not_contacted, contacted, follow_up, unreachable]
        notes: { type: ["string", "null"] }
    StatsSummary:
      type: object
      required:
        [
          totalVoters,
          strongSupporters,
          contacted,
          notContacted,
          lgasCovered,
          wardsCovered,
        ]
      properties:
        totalVoters: { type: integer }
        strongSupporters: { type: integer }
        contacted: { type: integer }
        notContacted: { type: integer }
        lgasCovered: { type: integer }
        wardsCovered: { type: integer }
    LgaCount:
      type: object
      required: [lga, count]
      properties:
        lga: { type: string }
        count: { type: integer }
    SupportLevelCount:
      type: object
      required: [supportLevel, count]
      properties:
        supportLevel: { type: string }
        count: { type: integer }
    Member:
      type: object
      required:
        [
          id,
          membershipCode,
          firstName,
          lastName,
          phone,
          vin,
          lga,
          ward,
          pollingUnit,
          membershipCategory,
          role,
          status,
          createdAt,
        ]
      properties:
        id: { type: integer }
        membershipCode: { type: string, description: Unique membership number }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: string }
        vin: { type: string, description: Voter Identification Number }
        gender: { type: ["string", "null"], enum: [male, female, null] }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        lga: { type: string }
        ward: { type: string }
        pollingUnit: { type: string }
        membershipCategory:
          type: string
          enum: [full_time, part_time]
        role:
          type: string
          enum: [member, unit_coordinator, ward_coordinator, lga_coordinator, admin]
        status:
          type: string
          enum: [pending, active, suspended]
        createdAt: { type: string }
    MemberInput:
      type: object
      required:
        [firstName, lastName, phone, vin, lga, ward, pollingUnit, membershipCategory]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: string, minLength: 7 }
        vin: { type: string, minLength: 4 }
        gender: { type: ["string", "null"], enum: [male, female, null] }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        lga: { type: string, minLength: 1 }
        ward: { type: string, minLength: 1 }
        pollingUnit: { type: string, minLength: 1 }
        membershipCategory:
          type: string
          enum: [full_time, part_time]
    MemberUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: string, minLength: 7 }
        gender: { type: ["string", "null"], enum: [male, female, null] }
        dateOfBirth: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
    AdminMemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [member, unit_coordinator, ward_coordinator, lga_coordinator, admin]
        status:
          type: string
          enum: [pending, active, suspended]
        membershipCategory:
          type: string
          enum: [full_time, part_time]
    VoterMatch:
      type: object
      required: [id, firstName, lastName, lga, ward, pollingUnit]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        lga: { type: string }
        ward: { type: string }
        pollingUnit: { type: string }
    Post:
      type: object
      required: [id, title, body, category, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        category:
          type: string
          enum: [news, job, scholarship, announcement]
        createdAt: { type: string }
    PostInput:
      type: object
      required: [title, body, category]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        category:
          type: string
          enum: [news, job, scholarship, announcement]
    PostUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        category:
          type: string
          enum: [news, job, scholarship, announcement]
    Event:
      type: object
      required: [id, title, startsAt, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        startsAt: { type: string }
        createdAt: { type: string }
    EventInput:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        startsAt: { type: string, minLength: 1 }
    Notification:
      type: object
      required: [id, title, body, broadcast, read, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        broadcast: { type: boolean }
        read: { type: boolean }
        createdAt: { type: string }
    NotificationInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        memberId:
          type: ["integer", "null"]
          description: Target member id; omit or null to broadcast to all members
    MembersSummary:
      type: object
      required: [totalMembers, activeMembers, pendingMembers, coordinators]
      properties:
        totalMembers: { type: integer }
        activeMembers: { type: integer }
        pendingMembers: { type: integer }
        coordinators: { type: integer }
